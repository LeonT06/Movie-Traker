<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leon's Movie Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: #333;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        
        h1 {
            font-size: 2.8rem;
            color: #2c3e50;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #7f8c8d;
            margin-bottom: 10px;
        }
        
        .header-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        
        .reset-btn, .watched-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            font-size: 1rem;
        }
        
        .watched-btn {
            background: #3498db;
        }
        
        .reset-btn:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }
        
        .watched-btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }
        
        .category {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }
        
        .category:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
        }
        
        h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ecf0f1;
            font-size: 1.8rem;
        }
        
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }
        
        .movie-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.4s ease;
            position: relative;
        }
        
        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15);
        }
        
        .movie-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            transition: all 0.5s ease;
        }
        
        .movie-card label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            cursor: pointer;
            font-weight: 600;
            color: #2c3e50;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        
        .movie-card label:hover {
            background: #f8f9fa;
        }
        
        input[type="checkbox"] {
            margin-left: 8px;
            transform: scale(1.2);
            cursor: pointer;
        }
        
        /* Effects for checked movies */
        .movie-card.checked {
            filter: grayscale(100%) brightness(70%);
            opacity: 0.7;
            transform: scale(0.95);
            order: 1; /* This will push checked movies to the bottom */
        }
        
        .movie-card.unchecked {
            order: 0; /* This will keep unchecked movies at the top */
        }
        
        /* Watched Movies Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background: white;
            border-radius: 15px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            position: relative;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #ecf0f1;
        }
        
        .modal-title {
            font-size: 1.8rem;
            color: #2c3e50;
        }
        
        .close-btn {
            background: #e74c3c;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .close-btn:hover {
            background: #c0392b;
            transform: rotate(90deg);
        }
        
        .watched-movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .watched-movie-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        
        .watched-movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }
        
        .watched-movie-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        
        .watched-movie-card .movie-title {
            padding: 10px;
            text-align: center;
            font-weight: 600;
            color: #2c3e50;
            font-size: 0.9rem;
        }
        
        .no-watched-movies {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
            font-size: 1.2rem;
        }
        
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: white;
            font-size: 0.9rem;
        }
        
        @media (max-width: 768px) {
            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .header-buttons {
                position: relative;
                top: auto;
                right: auto;
                justify-content: center;
                margin-top: 15px;
            }
            
            .modal-content {
                width: 95%;
                padding: 20px;
            }
            
            .watched-movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>

                <div class="movie-card unchecked" data-original-order="18"><img src="https://m.media-amazon.com/images/M/MV5BMTc5NTk2OTU1Nl5BMl5BanBnXkFtZTcwMDc3NjAwMg@@._V1_FMjpg_UX1000_.jpg" alt="Titanic"><label><input type="checkbox" id="movie100"> Titanic</label></div>
                <div class="movie-card unchecked" data-original-order="19"><img src="https://m.media-amazon.com/images/M/MV5BN2FjNmEyNWMtYzM0ZS00NjIyLTg5YzYtYThlMGVjNzE1OGViXkEyXkFqcGdeQXVyMTkxNjUyNQ@@._V1_FMjpg_UX1000_.jpg" alt="Dune"><label><input type="checkbox" id="movie101"> Dune</label></div>
                <div class="movie-card unchecked" data-original-order="20"><img src="https://m.media-amazon.com/images/M/MV5BYmMxZWRiMTgtZjM0Ny00NDQxLWIxYWQtZDdlNDNkOTEzYTdlXkEyXkFqcGdeQXVyMTkxNjUyNQ@@._V1_FMjpg_UX1000_.jpg" alt="Killers of the Flower Moon"><label><input type="checkbox" id="movie102"> Killers of the Flower Moon</label></div>

                <div class="movie-card unchecked" data-original-order="23"><img src="https://m.media-amazon.com/images/M/MV5BMjI0NmFkYzEtNzU2YS00NTg5LWIwYmMtNmQ1MTU0OGJjOTMxXkEyXkFqcGdeQXVyMjMxOTE0ODA@._V1_FMjpg_UX1000_.jpg" alt="Fast and Furious"><label><input type="checkbox" id="movie105"> Fast and Furious</label></div>

    <!-- Watched Movies Modal -->
    <div class="modal" id="watched-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">🎬 Your Watched Movies</h2>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <div id="watched-movies-container">
                <!-- Watched movies will be populated here -->
            </div>
        </div>
    </div>

    <script>
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        const resetBtn = document.getElementById('reset-btn');
        const watchedBtn = document.getElementById('watched-btn');
        const watchedModal = document.getElementById('watched-modal');
        const closeModal = document.getElementById('close-modal');
        const watchedMoviesContainer = document.getElementById('watched-movies-container');
        
        // Store original order for each category
        const originalOrders = {};
        
        // Initialize original orders
        document.querySelectorAll('.movie-grid').forEach(grid => {
            const categoryId = grid.id;
            originalOrders[categoryId] = [];
            
            grid.querySelectorAll('.movie-card').forEach((card, index) => {
                const movieId = card.querySelector('input[type="checkbox"]').id;
                originalOrders[categoryId].push({
                    movieId: movieId,
                    order: index
                });
            });
        });
        
        // Initialize checkboxes and apply effects for previously checked items
        checkboxes.forEach(chk => {
            if(localStorage.getItem(chk.id) === 'true') {
                chk.checked = true;
                applyCheckedEffects(chk);
            }
            
            chk.addEventListener('change', () => {
                localStorage.setItem(chk.id, chk.checked);
                applyCheckedEffects(chk);
                reorganizeCategory(chk);
            });
        });
        
        function applyCheckedEffects(checkbox) {
            const movieCard = checkbox.closest('.movie-card');
            
            if (checkbox.checked) {
                // Apply grayscale and dim effects immediately
                movieCard.classList.add('checked');
                movieCard.classList.remove('unchecked');
            } else {
                // Remove all effects if unchecked
                movieCard.classList.remove('checked');
                movieCard.classList.add('unchecked');
            }
        }
        
        function reorganizeCategory(checkbox) {
            const movieCard = checkbox.closest('.movie-card');
            const categoryGrid = movieCard.parentElement;
            
            // Remove the movie card from its current position
            movieCard.remove();
            
            // Add it back to the appropriate position based on checked status
            if (checkbox.checked) {
                // Add to the end (bottom) for checked movies
                categoryGrid.appendChild(movieCard);
            } else {
                // Add to the beginning (top) for unchecked movies
                categoryGrid.insertBefore(movieCard, categoryGrid.firstChild);
            }
        }
        
        function restoreOriginalOrder() {
            // Restore original order for each category
            Object.keys(originalOrders).forEach(categoryId => {
                const grid = document.getElementById(categoryId);
                const movies = Array.from(grid.querySelectorAll('.movie-card'));
                
                // Sort movies based on original order
                movies.sort((a, b) => {
                    const aOrder = parseInt(a.getAttribute('data-original-order'));
                    const bOrder = parseInt(b.getAttribute('data-original-order'));
                    return aOrder - bOrder;
                });
                
                // Clear the grid
                grid.innerHTML = '';
                
                // Append movies in original order
                movies.forEach(movie => {
                    grid.appendChild(movie);
                });
            });
        }
        
        // Reset functionality
        resetBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to reset all watched movies?')) {
                checkboxes.forEach(chk => {
                    chk.checked = false;
                    localStorage.setItem(chk.id, false);
                    
                    const movieCard = chk.closest('.movie-card');
                    movieCard.classList.remove('checked');
                    movieCard.classList.add('unchecked');
                });
                
                // Restore the original order
                restoreOriginalOrder();
            }
        });
        
        // Watched movies functionality
        watchedBtn.addEventListener('click', () => {
            showWatchedMovies();
        });
        
        closeModal.addEventListener('click', () => {
            watchedModal.style.display = 'none';
        });
        
        // Close modal when clicking outside
        window.addEventListener('click', (e) => {
            if (e.target === watchedModal) {
                watchedModal.style.display = 'none';
            }
        });
        
        function showWatchedMovies() {
            const watchedMovies = Array.from(checkboxes)
                .filter(chk => chk.checked)
                .map(chk => {
                    const movieCard = chk.closest('.movie-card');
                    const img = movieCard.querySelector('img').src;
                    const title = movieCard.querySelector('label').textContent.trim();
                    return { img, title };
                });
            
            watchedMoviesContainer.innerHTML = '';
            
            if (watchedMovies.length === 0) {
                watchedMoviesContainer.innerHTML = '<div class="no-watched-movies">You haven\'t watched any movies yet!</div>';
            } else {
                const grid = document.createElement('div');
                grid.className = 'watched-movies-grid';
                
                watchedMovies.forEach(movie => {
                    const movieCard = document.createElement('div');
                    movieCard.className = 'watched-movie-card';
                    movieCard.innerHTML = `
                        <img src="${movie.img}" alt="${movie.title}">
                        <div class="movie-title">${movie.title}</div>
                    `;
                    grid.appendChild(movieCard);
                });
                
                watchedMoviesContainer.appendChild(grid);
            }
            
            watchedModal.style.display = 'flex';
        }
        
        // Initialize the layout
        checkboxes.forEach(chk => {
            if (chk.checked) {
                reorganizeCategory(chk);
            }
        });
    </script>
</body>
</html>
